<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather Dashboard</h1>

      <div class="search-bar">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button id="searchBtn">Search</button>
      </div>
    </header>

    <main>
      <section class="weather-card">
        <h2>Current Weather</h2>

        <div class="weather-info">
          <p><strong>City:</strong> <span id="cityName" class="skeleton skeleton-text">            </span></p>
          <p><strong>Temperature:</strong> <span id="temperature" class="skeleton skeleton-text">            </span></p>
          <p><strong>Description:</strong> <span id="description" class="skeleton skeleton-text">            </span></p>
          <p><strong>Humidity:</strong> <span id="humidity" class="skeleton skeleton-text">            </span></p>
          <p><strong>Wind Speed:</strong> <span id="windSpeed" class="skeleton skeleton-text">            </span></p>
          <p><strong>Time:</strong> <span id="localTime" class="skeleton skeleton-text">            </span></p>
        </div>
      </section>

      <section class="forecast-section">
        <h2>7-Day Forecast</h2>

        <div class="forecast-row">
          <div class="forecast-card">
            <div class="skeleton skeleton-day"></div>
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-temp"></div>
          </div>

          <div class="forecast-card">
            <div class="skeleton skeleton-day"></div>
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-temp"></div>
          </div>

          <div class="forecast-card">
            <div class="skeleton skeleton-day"></div>
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-temp"></div>
          </div>

          <div class="forecast-card">
            <div class="skeleton skeleton-day"></div>
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-temp"></div>
          </div>

          <div class="forecast-card">
            <div class="skeleton skeleton-day"></div>
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-temp"></div>
          </div>

          <div class="forecast-card">
            <div class="skeleton skeleton-day"></div>
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-temp"></div>
          </div>

          <div class="forecast-card">
            <div class="skeleton skeleton-day"></div>
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-temp"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
