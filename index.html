<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather Dashboard</h1>

      <div class="search-bar">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button id="searchBtn">Search</button>
      </div>

      <div class="unit-toggle">
  <button id="celsiusBtn" class="active-unit">°C</button>
  <button id="fahrenheitBtn">°F</button>
</div>

<div id="recentSearches" class="recent-searches"></div>


      <p id="errorMessage" class="error-message"></p>

      <div id="errorBanner" class="error-banner hidden">
        <span id="errorBannerText">Failed to load weather data.</span>
        <button id="retryBtn">Retry</button>
      </div>
    </header>

    <main>
      <section class="weather-card">
        <h2>Current Weather</h2>

        <div class="weather-info">
          <p><strong>City:</strong> <span id="cityName" class="skeleton skeleton-text"></span></p>
          <p><strong>Temperature:</strong> <span id="temperature" class="skeleton skeleton-text"></span></p>
          <p><strong>Description:</strong> <span id="description" class="skeleton skeleton-text"></span></p>
          <p><strong>Humidity:</strong> <span id="humidity" class="skeleton skeleton-text"></span></p>
          <p><strong>Wind Speed:</strong> <span id="windSpeed" class="skeleton skeleton-text"></span></p>
          <p><strong>Time:</strong> <span id="localTime" class="skeleton skeleton-text"></span></p>
        </div>
      </section>

      <section class="forecast-section">
        <h2>7-Day Forecast</h2>

        <div class="forecast-row" id="forecastRow">
          <div class="forecast-card">
            <p class="forecast-day skeleton skeleton-day" id="day1"></p>
            <p class="forecast-icon skeleton skeleton-icon" id="icon1"></p>
            <p class="forecast-temp skeleton skeleton-temp" id="temp1"></p>
          </div>

          <div class="forecast-card">
            <p class="forecast-day skeleton skeleton-day" id="day2"></p>
            <p class="forecast-icon skeleton skeleton-icon" id="icon2"></p>
            <p class="forecast-temp skeleton skeleton-temp" id="temp2"></p>
          </div>

          <div class="forecast-card">
            <p class="forecast-day skeleton skeleton-day" id="day3"></p>
            <p class="forecast-icon skeleton skeleton-icon" id="icon3"></p>
            <p class="forecast-temp skeleton skeleton-temp" id="temp3"></p>
          </div>

          <div class="forecast-card">
            <p class="forecast-day skeleton skeleton-day" id="day4"></p>
            <p class="forecast-icon skeleton skeleton-icon" id="icon4"></p>
            <p class="forecast-temp skeleton skeleton-temp" id="temp4"></p>
          </div>

          <div class="forecast-card">
            <p class="forecast-day skeleton skeleton-day" id="day5"></p>
            <p class="forecast-icon skeleton skeleton-icon" id="icon5"></p>
            <p class="forecast-temp skeleton skeleton-temp" id="temp5"></p>
          </div>

          <div class="forecast-card">
            <p class="forecast-day skeleton skeleton-day" id="day6"></p>
            <p class="forecast-icon skeleton skeleton-icon" id="icon6"></p>
            <p class="forecast-temp skeleton skeleton-temp" id="temp6"></p>
          </div>

          <div class="forecast-card">
            <p class="forecast-day skeleton skeleton-day" id="day7"></p>
            <p class="forecast-icon skeleton skeleton-icon" id="icon7"></p>
            <p class="forecast-temp skeleton skeleton-temp" id="temp7"></p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
